{% extends "base.html" %}
{% block content %}
<h1>忘記密碼</h1>
<form method="post">
  <label>名稱：<input type="text" name="user_name" required></label><br><br>
  <label>Email：<input type="email" name="user_email" required></label><br><br>
  <label>新密碼：<input type="password" name="new_password" required></label><br><br>
  <label>確認新密碼：<input type="password" name="confirm_password" required></label><br><br>
  <button type="submit">確定</button>
</form>
{% if suggest_register %}
<p>查無此帳號，<a href="{{ url_for('auth.register') }}">要不要直接註冊一個新帳號？</a></p>
{% endif %}
{% endblock %}
