{% extends "base.html" %}
{% block content %}
<h1>登入</h1>
<form method="post">
  <label>名稱：<input type="text" name="user_name" required></label><br><br>
  <label>密碼：<input type="password" name="password" required></label><br><br>
  <button type="submit">登入</button>
</form>
<p><a href="{{ url_for('auth.forgot_password') }}">忘記密碼？</a> | <a href="{{ url_for('auth.register') }}">註冊新帳號</a></p>
{% endblock %}
