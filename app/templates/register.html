{% extends "base.html" %}
{% block content %}
<h1>註冊</h1>
<form method="post" enctype="multipart/form-data">
  <label>名稱：<input type="text" name="user_name" required></label><br><br>
  <label>Email：<input type="email" name="user_email" required></label><br><br>
  <label>密碼：<input type="password" name="password" required></label><br><br>
  <label>大頭貼(可略過)：<input type="file" name="avatar" accept="image/*"></label><br><br>
  <button type="submit">註冊</button>
</form>
<p><a href="{{ url_for('auth.login') }}">已經有帳號？回登入頁</a></p>
{% endblock %}
